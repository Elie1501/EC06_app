# =====================================================================
#  docker-compose — lance l'application + sa base PostgreSQL en local.
#
#  Démarrage :  cp .env.dist .env  &&  docker compose up
#
#  Le service "app" est construit sur le stage "builder" : il contient
#  les dépendances de dev (eslint / jest), ce qui permet à la CI de
#  lancer lint + test via `docker compose run --rm app ...`.
#  L'image FINALE de production (stage "runtime", légère + non-root)
#  est validée séparément par le job "build" du pipeline.
# =====================================================================

services:
  app:
    build:
      context: .
      target: builder
      args:
        NODE_VERSION: ${NODE_VERSION:-20}
    image: skillhub-api:dev-node${NODE_VERSION:-20}
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
