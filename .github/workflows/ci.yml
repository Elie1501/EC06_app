name: CI/CD

# Déclenché sur CHAQUE push (toutes branches : main, develop, feature/*),
# et en bonus sur les pull requests vers main/develop.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

# Permissions minimales par défaut ; le job build les élargit au besoin.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Job 1 — QUALITY : lint + tests exécutés DANS Docker (via compose)
  # ------------------------------------------------------------------
  quality:
    name: Quality (Node ${{ matrix.node_version }}, lint + test dans Docker)
    runs-on: ubuntu-latest
    # Matrice de build : lint + test rejoués sur plusieurs versions de
    # Node (le Dockerfile accepte NODE_VERSION en build-arg).
    strategy:
      fail-fast: false
      matrix:
        node_version: [20, 22]
    env:
      NODE_VERSION: ${{ matrix.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le .env n'est pas versionné : la CI le recrée depuis .env.dist.
      # Si on oublie cette étape, `docker compose` échoue → volontaire.
      - name: Préparer le .env depuis .env.dist
        run: cp .env.dist .env

      # Cache des dépendances npm pour accélérer les runs (clé par version de Node).
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ matrix.node_version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-${{ matrix.node_version }}-

      - name: Construire l'image applicative (stage builder, Node ${{ matrix.node_version }})
        run: docker compose build app

      - name: Lint (dans Docker)
        run: docker compose run --rm -T app npm run lint

      - name: Tests (dans Docker) + capture de l'artefact
        run: |
          mkdir -p reports
          docker compose run --rm -T app npm test 2>&1 | tee reports/test-results.txt

      - name: Publier l'artefact de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node${{ matrix.node_version }}
          path: reports/

  # ------------------------------------------------------------------
  # Job 2 — BUILD : construit l'image de PRODUCTION (stage runtime).
  #  Tags : sha court (toujours) + latest (sur main). Push GHCR sur main.
  # ------------------------------------------------------------------
  build:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser vers ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Métadonnées Docker (tags cohérents)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build local (jamais de push direct) pour pouvoir scanner l'image
      # AVANT toute éventuelle mise en registre.
      - name: Build de l'image runtime (local, pour scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extraire le premier tag (pour le scan)
        id: first_tag
        run: echo "tag=$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -n1)" >> "$GITHUB_OUTPUT"

      # Scan de vulnérabilités (bonus). Volontairement non-bloquant
      # (exit-code 0) pour ne pas casser le pipeline sur des CVE de
      # l'image de base node:alpine hors de notre contrôle ; le rapport
      # reste visible dans les logs du job.
      - name: Scan de l'image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.first_tag.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      # Connexion à GHCR uniquement sur main, avec le GITHUB_TOKEN
      # (secret injecté automatiquement, jamais en clair).
      - name: Connexion à GHCR (sur main)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pousser l'image vers GHCR (sur main)
        if: github.ref == 'refs/heads/main'
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  # ------------------------------------------------------------------
  # Job 3 — DEPLOY : déclenché uniquement sur main. Simulé par défaut.
  # ------------------------------------------------------------------
  deploy:
    name: Déploiement (simulé)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exécuter le déploiement simulé
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          chmod +x deploy.sh
          ./deploy.sh | tee deploy.log

      - name: Publier le log de déploiement
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log

  # ------------------------------------------------------------------
  # [BONUS non activé] Déploiement RÉEL par SSH — squelette documenté.
  #
  # Non activé faute de cible réelle (VM) disponible pendant l'épreuve.
  # Pour l'activer :
  #   1. Générer une paire de clés SSH dédiée au déploiement.
  #   2. Ajouter la clé PRIVÉE en secret GitHub `DEPLOY_SSH_KEY`, et
  #      `DEPLOY_HOST` / `DEPLOY_USER` (déjà utilisés en mode simulé).
  #   3. Renommer ce job (retirer le préfixe "x-") et retirer le "deploy"
  #      simulé ci-dessus, ou le garder comme fallback sur les autres
  #      branches.
