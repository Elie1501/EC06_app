name: CI/CD

# Déclenché sur CHAQUE push (toutes branches : main, develop, feature/*),
# et en bonus sur les pull requests vers main/develop.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

# Permissions minimales par défaut ; le job build les élargit au besoin.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Job 1 — QUALITY : lint + tests exécutés DANS Docker (via compose)
  # ------------------------------------------------------------------
  quality:
    name: Quality (lint + test dans Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le .env n'est pas versionné : la CI le recrée depuis .env.dist.
      # Si on oublie cette étape, `docker compose` échoue → volontaire.
      - name: Préparer le .env depuis .env.dist
        run: cp .env.dist .env

      # Cache des dépendances npm pour accélérer les runs.
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Construire l'image applicative (stage builder)
        run: docker compose build app

      - name: Lint (dans Docker)
        run: docker compose run --rm -T app npm run lint

      - name: Tests (dans Docker) + capture de l'artefact
        run: |
          mkdir -p reports
          docker compose run --rm -T app npm test 2>&1 | tee reports/test-results.txt

      - name: Publier l'artefact de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/

  # ------------------------------------------------------------------
  # Job 2 — BUILD : construit l'image de PRODUCTION (stage runtime).
  #  Tags : sha court (toujours) + latest (sur main). Push GHCR sur main.
  # ------------------------------------------------------------------
  build:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser vers ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Métadonnées Docker (tags cohérents)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Connexion à GHCR uniquement sur main, avec le GITHUB_TOKEN
      # (secret injecté automatiquement, jamais en clair).
      - name: Connexion à GHCR (sur main)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (+ push sur main) de l'image runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Job 3 — DEPLOY : déclenché uniquement sur main. Simulé par défaut.
  # ------------------------------------------------------------------
  deploy:
    name: Déploiement (simulé)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exécuter le déploiement simulé
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          chmod +x deploy.sh
          ./deploy.sh | tee deploy.log

      - name: Publier le log de déploiement
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log
